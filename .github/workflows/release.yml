name: Build

# Dispara na tag (v1.2.3) e também sob demanda, pelo botão do Actions.
# O manual importa: até o primeiro release sair, é assim que se descobre se o
# build de macOS e Linux funciona — sem precisar inventar uma tag pra testar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Uma plataforma quebrada não cancela as outras: na primeira vez que
      # isto roda, interessa ver os três resultados de uma vez.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: ''
          # macos-latest é ARM (Apple Silicon). O alvo universal cobre Intel no
          # mesmo .dmg, evitando publicar dois arquivos e explicar a diferença.
          # "latest" e não um número fixo: o GitHub aposenta as imagens antigas
          # (a macos-14 parou de ser aceita) e o job era cancelado sem rodar.
          - os: macos-latest
            label: macOS (universal)
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            label: Linux
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A tag v1.5.0 tem que bater com o "version" do tauri.conf.json: é esse
      # número que o app instalado informa. Se o release sair como v1.5.0 mas
      # o app continuar dizendo 1.4.4, quem atualizar segue preso na tela de
      # atualização obrigatória. Falha aqui, antes de gastar o build.
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $app do src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Sem os dois alvos o --target universal-apple-darwin falha.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Ubuntu 22.04 e não 24.04: o Tauri 2 usa webkit2gtk-4.1, e a 24.04
      # empacota uma combinação de versões que costuma quebrar o build.
      - name: Dependências de sistema do Tauri
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      # Sem assinatura de código: no Windows aparece o aviso do SmartScreen e
      # no macOS o Gatekeeper bloqueia na primeira abertura. Resolver isso
      # exige certificado pago (e conta de desenvolvedor Apple) — fica pra
      # quando houver release público de verdade.
      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: devflow-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg

  # Só na tag: junta os instaladores das três plataformas num GitHub Release
  # (link público e fixo, sem login e sem expirar). É esse link que vai na
  # coluna "url" da aba Releases da planilha, ou use
  # https://github.com/<repo>/releases/latest no updateUrl. Um job só, depois
  # da matriz, pra não ter três jobs disputando a criação do mesmo release.
  # Pelo botão manual do Actions (workflow_dispatch) continua só gerando os
  # artefatos, sem publicar nada.
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: devflow-*
          merge-multiple: true

      - name: Listar instaladores
        run: find dist -type f | sort

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DevFlow ${{ github.ref_name }}
          generate_release_notes: true
          # v1.5.0-beta.1 sai como pre-release: não vira o "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/**/*
