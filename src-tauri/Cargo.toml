[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "zstd", "cookies"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
boa_engine = "0.17.0"
rquickjs = { version = "0.9", features = ["full"] }
tauri-plugin-opener = "2.0"
open = "5.3" 
tauri-plugin-oauth = "2.0.0"
tauri-plugin-http = "2.0.0"
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.22"
url = "2.5.8"
keyring = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2.3.2"

# gRPC (grpc.rs): transporte HTTP/2 + TLS com os certificados do sistema
# (inclui CAs corporativas), mensagens dinâmicas montadas a partir do
# descriptor em tempo de execução (os .proto são do usuário, não dá pra gerar
# código no build) e um compilador de .proto em Rust puro (não exige protoc
# instalado na máquina).
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tonic-reflection = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
# TLS montado à mão pro gRPC com "ignorar certificado inválido" (o tonic não
# oferece isso). Mesmas versões que o tonic já puxa, com o backend ring —
# o aws-lc padrão exige compilador C/NASM no Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

# Só existe no Windows. Estava como dependência comum, o que fazia o build
# falhar em macOS e Linux antes mesmo de chegar no nosso código — o crate não
# compila fora do Windows. O único consumidor é o user_photo.rs, que já lê o
# registro atrás de #[cfg(target_os = "windows")].
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Só pros testes: certificado autoassinado pro servidor gRPC local do teste
# de "ignorar certificado inválido" (grpc.rs).
[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
